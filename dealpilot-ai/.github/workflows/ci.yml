name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --workspace=client

      - name: Install server dependencies
        run: npm ci --workspace=server

      - name: Lint client
        run: npm run lint --workspace=client

      - name: Lint server
        run: npm run lint --workspace=server

      - name: Build client
        run: npm run build --workspace=client

      - name: Build server
        run: npm run build --workspace=server

      - name: Test server
        run: npm run test --workspace=server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/dealpilot_test
          ACCESS_TOKEN_SECRET: test_access_secret_64_characters_long_placeholder_value
          REFRESH_TOKEN_SECRET: test_refresh_secret_64_characters_long_placeholder_value
          ACCESS_TOKEN_TTL: 15m
          REFRESH_TOKEN_TTL: 7d
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
          AI_API_KEY: test_key
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: test@dealpilot.ai
          SMTP_HOST: localhost
          SMTP_PORT: 587
          SMTP_USER: test
          SMTP_PASS: test
          APP_BASE_URL: http://localhost:5000
          RATE_LIMIT_WINDOW_MS: 900000
          RATE_LIMIT_MAX: 1000
          COOKIE_DOMAIN: localhost
          CORS_ORIGINS: http://localhost:5173
          CLIENT_URL: http://localhost:5173
