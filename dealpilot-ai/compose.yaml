services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - server
    networks:
      - app_network
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/dealpilot
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  app_network:
